name: PowerShell Checks

on:
  push:
    branches: [ master, develop ]
    # README.md is included because the tool-registration test checks the counts it advertises
    paths: [ '**.ps1', 'README.md', '.github/workflows/powershell-check.yml' ]
  pull_request:
    branches: [ master, develop ]
    paths: [ '**.ps1', 'README.md', '.github/workflows/powershell-check.yml' ]

jobs:
  syntax-check:
    runs-on: windows-latest
    name: Validate PowerShell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate PowerShell Syntax
        shell: powershell
        run: |
          $ErrorCount = 0
          $WarningCount = 0

          Write-Host "Scanning PowerShell files..." -ForegroundColor Cyan
          Write-Host ""

          Get-ChildItem -Recurse -Filter "*.ps1" | ForEach-Object {
            try {
              $content = Get-Content $_.FullName -Raw
              $tokens = @()
              $errors = @()

              [void][System.Management.Automation.PSParser]::Tokenize($content, [ref]$errors)

              if ($errors.Count -gt 0) {
                Write-Host "[FAIL] $($_.Name)" -ForegroundColor Red
                $errors | ForEach-Object {
                  Write-Host "   Line $($_.Token.StartLine): $($_.Message)" -ForegroundColor Yellow
                }
                $ErrorCount++
              } else {
                Write-Host "[OK] $($_.Name)" -ForegroundColor Green
              }
            }
            catch {
              Write-Host "[WARN] $($_.Name) - Parse error" -ForegroundColor Yellow
              Write-Host "   $_" -ForegroundColor Yellow
              $WarningCount++
            }
          }

          Write-Host ""
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "Results:" -ForegroundColor Cyan
          Write-Host "  [OK] Valid files"
          Write-Host "  [WARN] Warnings: $WarningCount"
          Write-Host "  [FAIL] Errors: $ErrorCount" -ForegroundColor Red

          if ($ErrorCount -gt 0) {
            Write-Host ""
            Write-Host "[FAIL] Syntax validation FAILED" -ForegroundColor Red
            exit 1
          } else {
            Write-Host ""
            Write-Host "[OK] All PowerShell files are valid!" -ForegroundColor Green
            exit 0
          }

      - name: Check file encoding
        shell: powershell
        run: |
          Write-Host "Checking file encoding..." -ForegroundColor Cyan
          $files = Get-ChildItem -Recurse -Filter "*.ps1"
          $issues = 0

          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -gt 3) {
              $bom = $bytes[0..3]
              if ($bom[0] -eq 0xEF -and $bom[1] -eq 0xBB -and $bom[2] -eq 0xBF) {
                # UTF-8 BOM (OK)
              } elseif ($bytes[0] -eq 0xFF -and $bytes[1] -eq 0xFE) {
                # UTF-16 LE (OK)
              }
            }
          }
          Write-Host "[OK] File encoding check passed" -ForegroundColor Green

      - name: Tool registration
        shell: powershell
        run: .\Tests\Test-ToolRegistration.ps1

      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          # Fails the build on Error severity only. Warnings are listed for information:
          # this codebase uses Write-Host deliberately (Gui\GuiHost.ps1 overrides it to
          # redirect tool output into the window), so warning-level rules are noisy here.
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber
          }
          Import-Module PSScriptAnalyzer

          $results = Invoke-ScriptAnalyzer -Path . -Recurse -ExcludeRule PSAvoidUsingWriteHost

          $errors   = @($results | Where-Object Severity -eq 'Error')
          $warnings = @($results | Where-Object Severity -eq 'Warning')

          if ($warnings.Count) {
            Write-Host ""
            Write-Host "Warnings ($($warnings.Count)) - not failing the build:" -ForegroundColor Yellow
            $warnings | Group-Object RuleName | Sort-Object Count -Descending |
              ForEach-Object { Write-Host ("  {0,4}  {1}" -f $_.Count, $_.Name) }
          }

          if ($errors.Count) {
            Write-Host ""
            Write-Host "Errors ($($errors.Count)):" -ForegroundColor Red
            $errors | ForEach-Object {
              Write-Host ("  {0}:{1}  [{2}] {3}" -f $_.ScriptName, $_.Line, $_.RuleName, $_.Message) -ForegroundColor Yellow
            }
            Write-Host ""
            Write-Host "[FAIL] PSScriptAnalyzer found errors" -ForegroundColor Red
            exit 1
          }

          Write-Host ""
          Write-Host "[OK] No PSScriptAnalyzer errors" -ForegroundColor Green
